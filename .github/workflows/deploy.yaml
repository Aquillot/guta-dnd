
name: Build and deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Diagnose Quartz executable
        run: |
          echo "Quartz executable:"
          ls -la node_modules/.bin/quartz || true
          echo "Executable target:"
          readlink -f node_modules/.bin/quartz || true
          echo "Quartz directory:"
          ls -la quartz || true
          echo "Package configuration:"
          node -p "JSON.stringify(require('./package.json').bin, null, 2)"

      - name: Build Quartz website
        run: node quartz/bootstrap-cli.mjs build

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
